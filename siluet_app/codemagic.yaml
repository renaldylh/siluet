# Konfigurasi Build Otomatis Codemagic CI/CD untuk Siluet App
# Dokumentasi lengkap: https://docs.codemagic.io/yaml-basic/yaml-getting-started/

workflows:
  android-release:
    name: Android Release Build (APK & AAB)
    max_build_duration: 30
    instance_type: mac_mini_m1 # Menggunakan mac_mini untuk kecepatan kompilasi
    environment:
      flutter: stable
      groups:
        # Jika Anda memiliki keystore untuk tanda tangan rilis,
        # Anda dapat menambahkannya di panel web Codemagic lalu merujuknya di sini.
        - android-signing 
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: '*' # Build berjalan untuk semua branch, atau ganti dengan 'main'
          include: true
    scripts:
      - name: Setup packages & dependencies
        script: |
          flutter pub get
      - name: Build Release APK
        script: |
          flutter build apk --release
      - name: Build Release AAB (Play Store Bundle)
        script: |
          flutter build appbundle --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - build/app/outputs/bundle/release/app-release.aab

  ios-release:
    name: iOS Release Build (IPA)
    max_build_duration: 45
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: '*'
          include: true
    scripts:
      - name: Setup packages & dependencies
        script: |
          flutter pub get
      - name: Build iOS Archive (Unsigned)
        script: |
          # Untuk melakukan build IPA tanpa sertifikat Apple Developer lokal,
          # kita menggunakan argumen --no-codesign.
          # Jika Anda mengaktifkan auto-code signing di dasbor Codemagic,
          # ganti perintah ini dengan: flutter build ipa --release
          flutter build ipa --release --no-codesign
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/Runner.xcarchive
